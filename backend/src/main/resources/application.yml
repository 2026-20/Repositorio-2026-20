spring:
  application:
    name: reactivos-backend

  # Base de datos local de desarrollo -- ver README.md para levantarla con Docker.
  # En produccion esto se sobreescribe con variables de entorno (OCI Database, no local).
  # Local: el contenedor "capris-postgres" publica en el 5433 y es el que tiene las
  # credenciales del repo (capris/capris_dev). Si corres tu propio Postgres en el 5432,
  # sobreescribelo con SPRING_DATASOURCE_URL.
  datasource:
    url: jdbc:postgresql://localhost:5433/capris_reactivos
    username: capris
    password: capris_dev

  jpa:
    hibernate:
      ddl-auto: validate # el esquema lo maneja Flyway, no Hibernate
    open-in-view: false

  flyway:
    enabled: true

# Secreto de desarrollo local UNICAMENTE -- en produccion se sobreescribe con la
# variable de entorno APP_JWT_SECRET (nunca commitear el secreto real).
app:
  jwt:
    secret: PeE4XuHYQWqj6XZI1sS8DtZHT0nIesSkkDK-EK4QFivi_52Hpnu0A95Rxr7P6uks
    expiracion-minutos: 480
    recuperacion:
      expiracion-minutos: 10 # HU-046: vida de la sesión temporal tras validar el OTP

  # HU-046: envío del correo con el OTP de recuperación. HU-047 (credenciales
  # iniciales) usa EL MISMO EmailService -- ver /seguridad/EmailService.java.
  email:
    # "log" (por defecto): no envía nada real, solo escribe el correo en el log --
    # así "mvn test" / "mvn verify" y el arranque en local no necesitan una API
    # key. "sendgrid": envía de verdad -- SOLO activarlo explícitamente, en la
    # práctica vía la variable de entorno APP_EMAIL_PROVEEDOR=sendgrid en el
    # servidor real (nunca en este archivo). "smtp": envía vía JavaMailSender
    # (MailHog en desarrollo: localhost:1025 sin credenciales), útil mientras no
    # haya un dominio propio verificado en SendGrid.
    proveedor: log
    remitente: ${APP_EMAIL_REMITENTE:recuperacioncapris@hotmail.com}
    remitente-nombre: "CAPRIS Médica - Reactivos"
    # HU-046 criterio 2: enviar el OTP en segundo plano (fire-and-forget) para
    # que la respuesta a /solicitar no tarde según exista o no el correo (eso
    # filtraría por temporización). false solo en las IT, que capturan el OTP
    # del mock de forma síncrona.
    asincrono: true
    sendgrid:
      # NUNCA la contraseña del buzón de correo -- esto es la API Key que se
      # genera dentro de SendGrid (Settings > API Keys, permiso restringido a
      # "Mail Send"). No se comitea un valor real acá, solo la referencia a la
      # variable de entorno.
      api-key: ${APP_SENDGRID_API_KEY:}
    smtp:
      # SMTP vía JavaMailSender (MailHog por defecto: localhost:1025, sin
      # autenticación). Ver SmtpEmailService.
      host: ${APP_EMAIL_SMTP_HOST:localhost}
      port: ${APP_EMAIL_SMTP_PORT:1025}
      username: ${APP_EMAIL_SMTP_USERNAME:}
      password: ${APP_EMAIL_SMTP_PASSWORD:}
    otp:
      expiracion-minutos: 15 # criterio de aceptación 3
      intentos-maximos: 3    # criterio de aceptación 5
