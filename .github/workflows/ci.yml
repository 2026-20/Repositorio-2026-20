name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + JUnit + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # mvn verify corre: pruebas unitarias (surefire, *Test.java), pruebas de
      # integracion con Testcontainers (failsafe, *IT.java - el runner de GitHub
      # ya trae Docker, no hace falta configurarlo aparte) y el reporte de JaCoCo.
      - name: Pruebas unitarias + integracion (Testcontainers) + cobertura
        run: mvn --batch-mode verify

      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          retention-days: 14

  frontend:
    name: Frontend (Vitest + Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias/componente (jsdom)
        run: npm test

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      # jsdom no implementa OPFS; estas pruebas corren en el Chromium real
      # instalado en el paso anterior (ver .github/ESTRUCTURA.md).
      - name: Pruebas de almacenamiento local (OPFS, navegador real)
        run: npm run test:browser

      - name: Cobertura
        run: npm run test:coverage

      - name: Levantar frontend para Cypress
        run: npm run dev &

      - name: Esperar a que el frontend responda
        run: npx wait-on http://localhost:5173

      # Las E2E de este sprint corren contra el stack real (backend en :8080 +
      # MailHog en :1025/:8025 + Postgres), que el CI no levanta. Por eso solo
      # se ejecutan aqui cuando el backend responde; si no hay backend se avisa
      # y no se bloquea el job (la evidencia se produce localmente y se adjunta
      # a cada task). Un fallo real de una prueba existente, con backend
      # disponible, si detiene el job.
      #
      # Cypress no tiene un equivalente a --pass-with-no-tests: si todavia no
      # existe ningun spec en cypress/e2e/ (antes de que se agregue el primero
      # de una HU), esto solo avisa en vez de poner el CI en rojo.
      - name: Pruebas E2E (Cypress)
        run: |
          if ! curl -s -o /dev/null http://localhost:8080/api/empresas; then
            echo "::warning::Backend (localhost:8080) no disponible en CI -- las E2E de Cypress se ejecutan localmente contra el stack real y su evidencia se adjunta a cada task."
            exit 0
          fi
          set +e
          salida=$(npm run cypress:run 2>&1)
          resultado=$?
          echo "$salida"
          # El runner de GitHub si mantiene los codigos de color ANSI de Cypress
          # (local no); hay que quitarlos antes de buscar el texto, si no el
          # grep de abajo nunca matchea y el job queda en rojo aunque sea
          # solo el caso de "todavia no hay specs".
          salida_plana=$(echo "$salida" | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          if [ $resultado -ne 0 ]; then
            if echo "$salida_plana" | grep -q "no spec files were found"; then
              echo "::warning::Sin specs de Cypress todavia (cypress/e2e/) -- no bloquea el CI."
            else
              exit $resultado
            fi
          fi

      - name: Publicar capturas de Cypress (si algo falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 14

      - name: Publicar reporte de cobertura (frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          retention-days: 14
