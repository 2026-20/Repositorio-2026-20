name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + JUnit + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # mvn verify corre: pruebas unitarias (surefire, *Test.java), pruebas de
      # integracion con Testcontainers (failsafe, *IT.java - el runner de GitHub
      # ya trae Docker, no hace falta configurarlo aparte) y el reporte de JaCoCo.
      - name: Pruebas unitarias + integracion (Testcontainers) + cobertura
        run: mvn --batch-mode verify

      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco
          retention-days: 14

  frontend:
    name: Frontend (Vitest + Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias/componente (jsdom)
        run: npm test

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      # jsdom no implementa OPFS; estas pruebas corren en el Chromium real
      # instalado en el paso anterior (ver .github/ESTRUCTURA.md).
      - name: Pruebas de almacenamiento local (OPFS, navegador real)
        run: npm run test:browser

      - name: Cobertura
        run: npm run test:coverage

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - name: Publicar reporte de cobertura (frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          retention-days: 14
